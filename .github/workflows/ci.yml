name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Short and explicit so a failure is about the code, not about a weak default tripping a guard.
  RIGGER_ADMIN_PASSWORD: ci-admin-password
  # Ingress is off by default (it binds 80/443 on the node). CI turns it on because the only thing
  # that proves routing works is a real HTTP request through Traefik.
  RIGGER_INGRESS_ENABLED: 'true'
  RIGGER_JWT_KEY: ci-jwt-signing-key-at-least-32-chars-long

jobs:
  # Backend only, on two JDKs. The matrix is the point: this project deliberately dropped
  # StructuredTaskScope and --enable-preview because preview class files bind to one JDK major
  # version and broke the build when the default JDK moved. Building on 21 and 25 keeps that honest.
  backend:
    name: Backend (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify reactor without the UI
        run: mvn -B clean verify -Dui.skip=true

      # The escape hatch must keep working: with no rigger-console/dist present, the resource root
      # is skipped with a warning and the build still succeeds.
      - name: Assert -Dui.skip=true needs no UI output
        run: |
          test ! -d rigger-console/dist || { echo "dist should not exist in this job"; exit 1; }
          echo "ok: reactor verified with no console build present"

  # Full artifact: builds the Angular console through Maven and proves the jar is actually complete.
  package:
    name: Package (UI embedded)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # frontend-maven-plugin downloads Node itself; caching npm's own cache is what makes
      # `npm ci` fast. Caching node_modules would be pointless — npm ci wipes it.
      - name: Cache npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('rigger-console/package-lock.json') }}
          restore-keys: npm-

      - name: Package (builds the console)
        run: mvn -B clean package -DskipTests

      # This is the regression that prompted the CI: the UI build used to be a manual step, so a
      # fresh clone produced a jar with no UI and nothing noticed. The nested i18n asset is checked
      # specifically because a pattern-based SPA fallback once served index.html in its place.
      - name: Assert the console is inside the jar
        run: |
          JAR=rigger-server/target/rigger-server-1.0.0-SNAPSHOT.jar
          test -f "$JAR" || { echo "missing $JAR"; exit 1; }
          for entry in \
            BOOT-INF/classes/static/ui/index.html \
            BOOT-INF/classes/static/ui/i18n/pt.json \
            BOOT-INF/classes/static/ui/i18n/en.json
          do
            unzip -l "$JAR" | grep -q "$entry" || { echo "jar is missing $entry"; exit 1; }
          done
          echo "ok: console embedded ($(unzip -l "$JAR" | grep -c 'static/ui/') entries)"

      # A remote webfont would make the build depend on the network and make every operator's
      # browser call a third party — neither is acceptable for a console that may run air-gapped.
      - name: Assert no remote font or CDN reference
        run: |
          if grep -rIl "fonts.googleapis.com\|fonts.gstatic.com" rigger-console/dist; then
            echo "remote font reference found in the built console"; exit 1
          fi
          echo "ok: no remote font references"

      - name: Console unit tests
        working-directory: rigger-console
        run: npx ng test --watch=false

      # Staged flat so the consuming job doesn't depend on how upload-artifact derives its
      # common path prefix from multiple inputs.
      - name: Stage jars
        run: |
          mkdir -p staging
          cp rigger-server/target/rigger-server-1.0.0-SNAPSHOT.jar staging/rigger-server.jar
          cp rigger-cli/target/riggerctl.jar staging/riggerctl.jar
          ls -l staging

      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: staging
          retention-days: 7

  # Runtime behaviour against a real Swarm. Every serious defect in this project was invisible to
  # compilation and unit tests and only appeared here.
  integration:
    name: Integration (Swarm + CLI + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: package
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: artifacts

      - name: Initialise Swarm
        run: |
          docker swarm init --advertise-addr 127.0.0.1
          docker info --format '{{.Swarm.LocalNodeState}}'

      - name: Start the server from the fat jar
        run: |
          RIGGER_ATTACH_EXISTING_SWARM=true \
          nohup java -jar artifacts/rigger-server.jar \
            > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sk https://localhost:7433/actuator/health | grep -q UP; then
              echo "server up"; exit 0
            fi
            sleep 3
          done
          echo "server never became healthy"; tail -80 server.log; exit 1

      # Serving the UI is resolved by file existence, and the nested i18n asset must come back as
      # JSON rather than the SPA shell.
      - name: Assert the UI serves correctly from the jar
        run: |
          fail=0
          for path in /ui/ /ui/topology /ui/i18n/pt.json; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost:7433$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done
          curl -sk https://localhost:7433/ui/i18n/pt.json | head -c 1 | grep -q '{' \
            || { echo "i18n did not return JSON"; fail=1; }
          exit $fail

      - name: CLI flow (apply, pods, logs framing, delete)
        run: |
          set -e
          CLI="java -jar artifacts/riggerctl.jar"
          $CLI init --server https://localhost:7433 --insecure
          $CLI login -u admin -p "$RIGGER_ADMIN_PASSWORD" --insecure

          cat > /tmp/ci-manifests.yaml <<'YAML'
          apiVersion: rigger.io/v1
          kind: ConfigMap
          metadata:
            name: ci-cm
            namespace: default
          spec:
            data:
              GREETING: "ci"
          ---
          apiVersion: rigger.io/v1
          kind: Deployment
          metadata:
            name: ci-web
            namespace: default
          spec:
            replicas: 1
            selector:
              app: ci-web
            image: nginx:alpine
            configMapRefs:
              - ci-cm
          ---
          apiVersion: rigger.io/v1
          kind: Service
          metadata:
            name: ci-web-svc
            namespace: default
          spec:
            type: LoadBalancer
            selector:
              app: ci-web
            ports:
              - port: 18080
                targetPort: 80
                protocol: TCP
          YAML

          # A dry run must change nothing — it used to persist and reconcile for real.
          $CLI apply -f /tmp/ci-manifests.yaml -n default --dry-run -i
          if $CLI get deployments -n default -i | grep -q ci-web; then
            echo "dry run created resources"; exit 1
          fi
          echo "ok: dry run changed nothing"

          $CLI apply -f /tmp/ci-manifests.yaml -n default -i

          # Wait for reconciliation onto Swarm, then for a running task.
          for i in $(seq 1 40); do
            docker service ls --format '{{.Replicas}}' | grep -q '^[1-9]' && break
            sleep 5
          done
          docker service ls

          $CLI get pods -n default -i
          POD=$($CLI get pods -n default -i | awk 'NR>2 {print $1; exit}')

          # riggerctl reads raw lines. When the two log framings shared one path, content
          # negotiation handed the CLI the SSE variant and it started printing "data:" prefixes.
          $CLI logs "$POD" -n default -i > /tmp/cli-logs.txt || true
          head -3 /tmp/cli-logs.txt
          if grep -q '^data:' /tmp/cli-logs.txt; then
            echo "CLI received SSE framing instead of raw lines"; exit 1
          fi
          test -s /tmp/cli-logs.txt || { echo "CLI logs were empty"; exit 1; }
          echo "ok: CLI log framing is raw"

      # docker-compose support is detected by content and converted server-side. It was declared in
      # the README long before anything routed to it, so it gets its own check.
      - name: Compose input is detected and converted
        run: |
          set -e
          CLI="java -jar artifacts/riggerctl.jar"
          cat > /tmp/ci-compose.yml <<'YAML'
          services:
            composed:
              image: nginx:alpine
              deploy:
                replicas: 1
              ports:
                - "18090:80"
          YAML
          $CLI apply -f /tmp/ci-compose.yml -n default -i
          $CLI get deployments -n default -i | grep -q composed \
            || { echo "compose service was not converted into a Deployment"; exit 1; }
          $CLI get services -n default -i | grep -q composed-svc \
            || { echo "compose ports did not produce a Service"; exit 1; }
          echo "ok: compose converted"
          echo y | $CLI delete deployment composed -n default -i
          echo y | $CLI delete service composed-svc -n default -i

      - name: Assert reconciliation converges
        run: |
          # A spec-hash mismatch once made every 15s cycle re-update the service forever, which
          # looks perfectly healthy in the logs. Only a version index that stops moving proves it
          # converged. Requiring three consecutive identical samples avoids false-failing while a
          # rolling update is still legitimately settling.
          svc=rigger-default-ci-web
          stable=0
          prev=""
          for i in $(seq 1 16); do
            cur=$(docker service inspect "$svc" --format '{{.Version.Index}}')
            if [ "$cur" = "$prev" ]; then stable=$((stable+1)); else stable=0; fi
            echo "sample $i: version=$cur (stable streak=$stable)"
            [ "$stable" -ge 2 ] && { echo "ok: reconciliation converged at version $cur"; exit 0; }
            prev=$cur
            sleep 15
          done
          echo "service version never stopped climbing; reconciliation is not converging"
          exit 1

      # Wrong status codes are as much a defect as wrong data: a 500 tells the caller to retry and
      # tells us to go read a stack trace, when in each of these cases the request was simply bad.
      # All three returned 500 before they were mapped.
      - name: API error contract
        run: |
          set -e
          T=$(curl -sk -X POST https://localhost:7433/api/v1/auth/login \
                -H 'Content-Type: application/json' \
                -d "{\"username\":\"admin\",\"password\":\"$RIGGER_ADMIN_PASSWORD\"}" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          echo "$T" > /tmp/token
          fail=0
          check() { # description, expected, actual
            printf '%-52s expected %s got %s\n' "$1" "$2" "$3"
            [ "$2" = "$3" ] || fail=1
          }
          api() { curl -sk -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" "$@"; }

          check "unmapped URL is 404, not 500" 404 \
            "$(api https://localhost:7433/api/v1/no-such-endpoint)"
          check "malformed JSON body is 400, not 500" 400 \
            "$(api -X POST https://localhost:7433/api/v1/namespaces/default/apply \
                 -H 'Content-Type: application/json' -d '{not json')"
          # dryRun is optional, but a plain boolean record component made omitting it a 500.
          check "apply without dryRun succeeds" 200 \
            "$(api -X POST https://localhost:7433/api/v1/namespaces/default/apply \
                 -H 'Content-Type: application/json' \
                 -d '{"manifest":"apiVersion: rigger.io/v1\nkind: ConfigMap\nmetadata:\n  name: ci-nodry\n  namespace: default\nspec:\n  data:\n    K: \"v\"\n"}')"
          exit $fail

      # Node reads used to come only from cluster_nodes, which just the SSH provisioning path writes.
      # So an attached Swarm — the documented dev setup, and this job's setup — reported zero nodes
      # on the Nodes page, the dashboard and the cluster status, while docker node ls showed a
      # healthy leader. CI could not have caught it: its assertion was only "the nodes page renders".
      - name: Cluster nodes come from Swarm, not just the provisioning table
        run: |
          set -e
          T=$(cat /tmp/token)
          fail=0
          swarm_nodes=$(docker node ls --format '{{.Hostname}}' | wc -l)
          api=$(curl -sk -H "Authorization: Bearer $T" https://localhost:7433/api/v1/cluster/nodes)
          echo "swarm reports $swarm_nodes node(s); api returned: $api"
          reported=$(printf '%s' "$api" | python3 -c 'import sys,json;print(len(json.load(sys.stdin)))')
          [ "$reported" = "$swarm_nodes" ] || { echo "api listed $reported of $swarm_nodes nodes"; fail=1; }
          # A node listed but with an empty hostname or an OFFLINE status would still pass a count
          # check, so each field the Nodes page shows is asserted on its own.
          fields=$(printf '%s' "$api" | python3 -c 'import sys,json;n=json.load(sys.stdin)[0];print(bool(n["name"]),n["status"],n["role"],bool(n["swarmNodeId"]))')
          echo "node fields: $fields"
          [ "$fields" = "True ACTIVE MANAGER True" ] || { echo "node fields wrong"; fail=1; }
          status=$(curl -sk -H "Authorization: Bearer $T" https://localhost:7433/api/v1/cluster \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["status"],d["activeNodes"],d["totalNodes"])')
          echo "cluster status: $status"
          [ "$status" = "healthy 1 1" ] || { echo "cluster reported '$status'"; fail=1; }
          exit $fail

      # The sampler is the only thing that makes the console's charts survive a reload, and it fails
      # silently: an empty series and a broken sampler look identical from the outside.
      - name: Metrics series is recorded and scoped
        run: |
          set -e
          T=$(cat /tmp/token)
          fail=0
          series() {
            curl -sk -H "Authorization: Bearer $T" \
              "https://localhost:7433/api/v1/metrics/series?$1"
          }
          points=$(series 'metric=replicas.running&minutes=60' \
            | python3 -c 'import sys,json;print(len(json.load(sys.stdin)["points"]))')
          echo "cluster series points: $points"
          [ "$points" -ge 2 ] || { echo "sampler recorded no history"; fail=1; }

          ordered=$(series 'metric=replicas.running&minutes=60' | python3 -c 'import sys,json;p=json.load(sys.stdin)["points"];print(all(a["t"]<=b["t"] for a,b in zip(p,p[1:])))')
          echo "points ordered oldest-first: $ordered"
          [ "$ordered" = "True" ] || { echo "series is not in plot order"; fail=1; }

          dep=$(series 'metric=deployment.replicas.desired&namespace=default&name=ci-web&minutes=60' \
            | python3 -c 'import sys,json;print(len(json.load(sys.stdin)["points"]))')
          echo "per-Deployment series points: $dep"
          [ "$dep" -ge 1 ] || { echo "no per-Deployment samples"; fail=1; }

          # A typo must not be indistinguishable from "no data yet".
          code=$(curl -sk -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" \
            'https://localhost:7433/api/v1/metrics/series?metric=cpu.bogus')
          echo "unknown metric -> $code"
          [ "$code" = "400" ] || fail=1

          # A namespace-scoped identity may chart its own workloads but not the cluster.
          curl -sk -X POST https://localhost:7433/api/v1/users -H "Authorization: Bearer $T" \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-dep","password":"ci-deployer-password","role":"DEPLOYER","namespace":"default"}' \
            -o /dev/null
          D=$(curl -sk -X POST https://localhost:7433/api/v1/auth/login \
                -H 'Content-Type: application/json' \
                -d '{"username":"ci-dep","password":"ci-deployer-password"}' \
              | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          scoped=$(curl -sk -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $D" \
            'https://localhost:7433/api/v1/metrics/series?metric=nodes.total')
          echo "cluster metric as DEPLOYER -> $scoped"
          [ "$scoped" = "403" ] || fail=1
          own=$(curl -sk -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $D" \
            'https://localhost:7433/api/v1/metrics/series?metric=deployment.cpu&namespace=default&name=ci-web')
          echo "own Deployment metric as DEPLOYER -> $own"
          [ "$own" = "200" ] || fail=1
          exit $fail

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Browser walkthrough
        working-directory: e2e
        env:
          BASE: https://localhost:7433
          ADMIN_PASSWORD: ${{ env.RIGGER_ADMIN_PASSWORD }}
        run: node console.mjs

      # Traefik ingress. The single assertion that matters here is the HTTP request through Traefik:
      # every other check below was green while routing was completely dead, because Traefik <= 3.5
      # pins Docker API 1.24 in its Swarm provider and cannot negotiate it, so on Engine 29 it starts,
      # reports 1/1, answers HTTP and discovers nothing. A wrong label spelling fails the same silent
      # way. Compilation, labels and networks prove nothing on their own.
      - name: Traefik ingress routes traffic
        run: |
          set -e
          T=$(cat /tmp/token)
          fail=0
          host=ci-ingress.rigger.test
          api() { curl -sk -H "Authorization: Bearer $T" -H 'Content-Type: application/json' "$@"; }
          apply() { api -X POST -o /dev/null -w '%{http_code}' \
            "https://localhost:7433/api/v1/namespaces/default/apply" -d "$1"; }
          route() { curl -s -o /dev/null -w '%{http_code}' -H "Host: $1" http://127.0.0.1/; }
          until_route() { # host, expected, seconds
            for i in $(seq 1 "$3"); do [ "$(route "$1")" = "$2" ] && return 0; sleep 1; done
            return 1
          }

          svc() { printf '{"manifest":"apiVersion: rigger.io/v1\\nkind: Service\\nmetadata:\\n  name: ci-web-svc\\n  namespace: default\\nspec:\\n  type: LoadBalancer\\n  selector:\\n    app: ci-web\\n  ports:\\n    - port: 18080\\n      targetPort: 80\\n      protocol: TCP\\n%s"}' "$1"; }

          echo "== network =="
          net=$(docker network inspect rigger-ingress --format '{{.Driver}} {{.Scope}}')
          echo "  $net"; [ "$net" = "overlay swarm" ] || fail=1

          echo "== controller =="
          for i in $(seq 1 40); do
            reps=$(docker service ls --filter label=rigger.io/component=ingress-controller --format '{{.Replicas}}')
            [ "$reps" = "1/1" ] && break; sleep 3
          done
          echo "  replicas=$reps"; [ "$reps" = "1/1" ] || fail=1
          ctl=$(docker service inspect rigger-ingress-controller \
            --format '{{index .Spec.Labels "rigger.io/managed"}}|{{(index .Spec.TaskTemplate.ContainerSpec.Mounts 0).ReadOnly}}|{{.Spec.TaskTemplate.Placement.Constraints}}')
          echo "  managed|socketReadOnly|constraints = $ctl"
          case "$ctl" in "|true|[node.role == manager]") ;; *) echo "  controller hardening wrong"; fail=1;; esac

          echo "== ingress on the existing ci-web-svc =="
          code=$(apply "$(svc '  ingress:\\n    host: '"$host"'\\n    tls: false\\n')")
          echo "  apply -> $code"; [ "$code" = "200" ] || fail=1

          echo "== labels and network attachment =="
          for i in $(seq 1 30); do
            rule=$(docker service inspect rigger-default-ci-web \
              --format '{{index .Spec.Labels "traefik.http.routers.rigger-default-ci-web-svc.rule"}}' 2>/dev/null || true)
            [ -n "$rule" ] && break; sleep 3
          done
          echo "  rule=$rule"
          [ "$rule" = "Host(\`$host\`)" ] || { echo "  router rule wrong"; fail=1; }
          docker service inspect rigger-default-ci-web --format '{{.Spec.Labels}}' | grep -q 'traefik.docker.' \
            && { echo "  v2 label spelling emitted — fails silently with a 404"; fail=1; } || true
          netid=$(docker network inspect -f '{{.Id}}' rigger-ingress)
          # Docker echoes the network ID back, not the name: comparing to the name silently passes nothing.
          docker service inspect rigger-default-ci-web --format '{{.Spec.TaskTemplate.Networks}}' | grep -q "$netid" \
            || { echo "  network not attached by ID"; fail=1; }

          echo "== THE PROOF: HTTP through Traefik =="
          # 15s reconcile + ~15s Traefik provider refresh + task recreation from the network change.
          until_route "$host" 200 120 && echo "  $host -> 200" || { echo "  $host -> $(route $host) after 120s"; fail=1; }
          echo "  unknown host -> $(route nope.rigger.test) (expect 404)"

          echo "== labels, network and published ports survive an unrelated update =="
          echo y | java -jar artifacts/riggerctl.jar scale deployment ci-web --replicas=2 -n default -i
          sleep 25
          docker service inspect rigger-default-ci-web --format '{{.Spec.EndpointSpec.Ports}}' | grep -q 18080 \
            || { echo "  published ports wiped by the update"; fail=1; }
          docker service inspect rigger-default-ci-web --format '{{.Spec.Labels}}' | grep -q 'traefik.enable' \
            || { echo "  traefik labels wiped by the update"; fail=1; }
          until_route "$host" 200 90 && echo "  routing after scale -> 200" || { echo "  routing broken after scale"; fail=1; }

          echo "== convergence, both directions =="
          # Stable: an unstable spec-hash makes the version index climb forever.
          a=$(docker service inspect rigger-default-ci-web --format '{{.Version.Index}}')
          sleep 45
          b=$(docker service inspect rigger-default-ci-web --format '{{.Version.Index}}')
          echo "  version index $a -> $b"; [ "$a" = "$b" ] || { echo "  still updating"; fail=1; }
          # And responsive: a hash that omits the binding never applies a change at all. Each of those
          # two bugs passes the other's test, so both directions are required.
          apply "$(svc '  ingress:\\n    host: ci2.rigger.test\\n    tls: false\\n')" >/dev/null
          until_route ci2.rigger.test 200 120 && echo "  new host -> 200" || { echo "  host change never applied"; fail=1; }

          echo "== removing the ingress =="
          apply "$(svc '')" >/dev/null
          sleep 25
          docker service inspect rigger-default-ci-web --format '{{.Spec.Labels}}' | grep -q 'traefik.enable' \
            && { echo "  traefik labels not removed"; fail=1; } || true
          docker service inspect rigger-default-ci-web --format '{{.Spec.EndpointSpec.Ports}}' | grep -q 18080 \
            || { echo "  removing the ingress also dropped the published ports"; fail=1; }
          # Traefik's own refresh lags the label removal by roughly one poll, so this must retry.
          until_route ci2.rigger.test 404 60 && echo "  host now 404" || { echo "  host still routed"; fail=1; }
          exit $fail

      - name: Delete resources through the API
        if: always()
        run: |
          CLI="java -jar artifacts/riggerctl.jar"
          for r in "deployment ci-web" "service ci-web-svc" "configmap ci-cm"; do
            echo y | $CLI delete $r -n default -i || true
          done
          # Filtered by the managed label on purpose: rigger-ingress-controller is deliberately NOT
          # labelled `rigger.io/managed=true` (otherwise DeploymentController would GC it every 15s),
          # so it stays up for the whole run and an unfiltered drain check would report a phantom leak
          # forever.
          for i in $(seq 1 30); do
            [ -z "$(docker service ls --filter label=rigger.io/managed=true -q)" ] \
              && [ -z "$(docker config ls -q)" ] && break
            sleep 4
          done
          echo "managed services left: $(docker service ls --filter label=rigger.io/managed=true -q | wc -l)," \
               "configs left: $(docker config ls -q | wc -l)"
          # And the controller must still be there — that is the regression test for the label rule.
          docker service ls --filter label=rigger.io/component=ingress-controller --format '{{.Name}} {{.Replicas}}'

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-diagnostics
          path: |
            server.log
            e2e/shots
          retention-days: 7
