# Service (LoadBalancer) — publishes the web tier outside the cluster.
#
# The operator resolves the Deployment whose selector matches, then publishes these ports on
# that Swarm service in ingress mode, so the port answers on EVERY node of the swarm.
#
# `port` is therefore a cluster-wide published port: it must be free on all nodes and must
# not collide with any other published port in the swarm. That is why this example uses
# 18081 rather than 80 — pick your own free port before applying.
apiVersion: rigger.io/v1
kind: Service
metadata:
  name: shopfront-web-public
  namespace: demo
  labels:
    app: shopfront
    part-of: shopfront
spec:
  type: LoadBalancer
  selector:
    app: shopfront-web
    tier: web
  ports:
    - port: 18081        # published on every node
      targetPort: 80     # port the container listens on
      protocol: TCP
