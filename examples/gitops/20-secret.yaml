# Secret — sensitive values for the shopfront app.
#
# Values are base64 in the YAML (that is the wire format, NOT encryption).
# Rigger encrypts them with AES-256-GCM before persisting, so the database only ever
# holds ciphertext, and every read back through the API/CLI/UI returns
# {"keys":"redacted"}. The one place the real value is decrypted is the operator's
# SecretController, which pushes it into a Docker Secret.
#
#   echo -n 'my-real-value' | base64
#
# Committing real credentials to a Git repository is still a bad idea — for anything
# that matters use `spec.vaultRef: <vault/path>` instead of `spec.data` (exactly one
# of the two is allowed).
apiVersion: rigger.io/v1
kind: Secret
metadata:
  name: shopfront-secrets
  namespace: demo
  labels:
    app: shopfront
    part-of: shopfront
spec:
  data:
    # "demo-not-a-real-password"
    db.password: ZGVtby1ub3QtYS1yZWFsLXBhc3N3b3Jk
    # "demo-api-key"
    api.key: ZGVtby1hcGkta2V5
