# Service (ClusterIP) — internal-only access from other workloads in the cluster.
#
# ClusterIP reconciliation is deliberately a no-op: Swarm's overlay network already gives
# every service a DNS-resolvable VIP, so other containers reach this Deployment as
# `rigger-demo-shopfront-web` on the overlay network. The resource exists so the intent is
# declared, visible in the console topology, and RBAC-audited like everything else.
apiVersion: rigger.io/v1
kind: Service
metadata:
  name: shopfront-web-internal
  namespace: demo
  labels:
    app: shopfront
    part-of: shopfront
spec:
  type: ClusterIP        # ClusterIP | LoadBalancer — exactly this casing
  selector:
    app: shopfront-web   # subset of the Deployment's selector
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
