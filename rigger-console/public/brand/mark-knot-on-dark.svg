<!--
  Colour-explicit copy of mark-knot for <img>/favicon use on DARK surfaces — currentColor does not
  inherit through an <img> tag, so a mark referenced that way renders black.

  #C1A9FF is brand-300 (oklch(0.79 0.13 295)) converted to sRGB. The light end of the scale, not
  brand-500: on the graphite masthead a mid violet reads as muddy, and the mark has to hold its own
  against white wordmark text beside it.

  Concept D — "hitch": two lines crossing and bound, the simplest possible read of "rigged
  together". Fewer strokes than the rigging concept so it holds up small, and it isn't a letter, so
  it doesn't fall back to being a generic monogram.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Rigger">
  <!-- the standing part, running corner to corner under tension -->
  <path d="M5 26 C5 14, 27 18, 27 6"
        stroke="#C1A9FF" stroke-width="3.2" stroke-linecap="round"/>
  <!-- the turn taken around it -->
  <path d="M27 26 C27 14, 5 18, 5 6"
        stroke="#C1A9FF" stroke-width="3.2" stroke-linecap="round"/>
  <!-- the bight where they bind -->
  <circle cx="16" cy="17.2" r="3.4" fill="#C1A9FF"/>
</svg>
