<!--
  Horizontal lockup for the masthead: mark + "Rigger" wordmark, on light surfaces.

  The wordmark is drawn as paths, not text. An <img> cannot load a webfont, and this project
  deliberately ships no webfont at all — a `font-family` here would render in whatever the machine
  happens to have and the lockup would look different on every operator's screen.

  Letterforms are geometric sans, near-uniform stroke, matching the console's own type. The two
  `g`s share one descender construction so the word doesn't wobble. Cap height 20 on a 32 baseline
  grid, so the wordmark's optical weight sits level with the mark rather than floating above it.

  #7A40DA is brand-600 for the mark — the same value primary buttons use — and #2A2733 for the
  word, matching the text-primary token rather than pure black, which reads as a hole on a white page.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 32" fill="none" role="img" aria-label="Rigger">
  <!-- mark -->
  <g stroke="#7A40DA" stroke-width="3.2" stroke-linecap="round">
    <path d="M5 26 C5 14, 27 18, 27 6"/>
    <path d="M27 26 C27 14, 5 18, 5 6"/>
  </g>
  <circle cx="16" cy="17.2" r="3.4" fill="#7A40DA"/>

  <!-- wordmark: R i g g e r, cap height 20, baseline y=24 -->
  <g fill="#2A2733">
    <!-- R -->
    <path d="M42 24V8h6.4a4.6 4.6 0 0 1 0 9.2h-1.2L52 24h-3.3l-4.4-6.8H45V24h-3zm3-9.4h3.2a1.9 1.9 0 0 0 0-3.8H45v3.8z"/>
    <!-- i: dot separated from the stem, which is what keeps it legible when the lockup is small -->
    <rect x="54.4" y="12.6" width="2.7" height="11.4" rx="1.35"/>
    <circle cx="55.75" cy="9.4" r="1.7"/>
    <!-- g -->
    <path d="M65.6 12.4c1.5 0 2.7.5 3.4 1.4v-1.2h2.7v11.6c0 3.1-2.2 5-5.6 5-2.5 0-4.4-1-5.2-2.7l2.4-1.2c.5.9 1.4 1.4 2.7 1.4 1.7 0 2.7-1 2.7-2.5v-1.1c-.7.9-1.9 1.4-3.4 1.4-3.1 0-5.4-2.5-5.4-6.1s2.3-6 5.7-6zm.4 2.6c-1.8 0-3 1.4-3 3.4s1.2 3.4 3 3.4 3-1.4 3-3.4-1.2-3.4-3-3.4z"/>
    <!-- g (second) -->
    <path d="M80.1 12.4c1.5 0 2.7.5 3.4 1.4v-1.2h2.7v11.6c0 3.1-2.2 5-5.6 5-2.5 0-4.4-1-5.2-2.7l2.4-1.2c.5.9 1.4 1.4 2.7 1.4 1.7 0 2.7-1 2.7-2.5v-1.1c-.7.9-1.9 1.4-3.4 1.4-3.1 0-5.4-2.5-5.4-6.1s2.3-6 5.7-6zm.4 2.6c-1.8 0-3 1.4-3 3.4s1.2 3.4 3 3.4 3-1.4 3-3.4-1.2-3.4-3-3.4z"/>
    <!-- e -->
    <path d="M95.3 12.4c3.3 0 5.5 2.4 5.5 5.9v1h-8.4c.3 1.6 1.5 2.5 3.1 2.5 1.2 0 2.1-.5 2.6-1.3l2.3 1.2c-1 1.7-2.7 2.6-4.9 2.6-3.5 0-6-2.5-6-6s2.4-5.9 5.8-5.9zm-2.8 4.7h5.5c-.3-1.5-1.3-2.3-2.7-2.3-1.4 0-2.4.8-2.8 2.3z"/>
    <!-- r -->
    <path d="M104.2 24V12.6h2.7v1.6c.6-1.2 1.7-1.8 3.2-1.8h.7v2.8h-1c-1.8 0-2.9 1-2.9 3V24h-2.7z"/>
  </g>
</svg>
